schema_version: 1

context:
  name: libvulkan-loader
  version: "1.4.357.0"

package:
  name: ${{ name }}
  version: ${{ version }}

# For this repo, v**** tags exists, but apparently the stable tags (the one corresponding to versions
# that are available for download at https://vulkan.lunarg.com/sdk/home) are the vulkan-sdk-*** ones
# See https://github.com/KhronosGroup/Vulkan-Headers#version-tagging-scheme
source:
  url: https://github.com/KhronosGroup/Vulkan-Loader/archive/refs/tags/vulkan-sdk-${{ version }}.tar.gz
  sha256: 54f2537df22313768da0317dda2abdaaab7711b4081c48c869a79db343d0ae70
  patches:
    - disable_macos_framework.patch
    # https://github.com/KhronosGroup/Vulkan-Loader/issues/2017
    - dedup_icds_by_library_handle.patch

build:
  number: 2

requirements:
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - python *
    - pkg-config
  host:
    - libvulkan-headers =${{ version }}
    - if: linux
      then:
        - libxcb
        - xorg-libx11
        - xorg-libxrandr
        - xorg-xorgproto
  run_constraints:
    - libvulkan-headers =${{ version }}
  run_exports:
    - ${{ pin_subpackage(name, upper_bound="x") }}
  ignore_run_exports:
    from_package:
       # only the headers are used by the feedstock
      - libxcb

tests:
  - package_contents:
      lib:
        - if: win
          then: vulkan-1
          else: vulkan
  - script:
      # `$PREFIX/share` must end up in SYSCONFDIR, the part of the loader's
      # compiled-in manifest search path that is consulted unconditionally.
      # Otherwise conda-installed ICDs (mesa-lavapipe, mesa-anv, ...) are
      # invisible whenever XDG_DATA_DIRS is set, which is the case in every
      # desktop session.  The trailing `[^:]` is what distinguishes the
      # standalone SYSCONFDIR string from the `$PREFIX/share:/usr/local/share:...`
      # one baked in by FALLBACK_DATA_DIRS.
      - if: unix
        then: test -n "$(grep -al "${PREFIX}/share[^:]" ${PREFIX}/lib/libvulkan.so.1 ${PREFIX}/lib/libvulkan.1.dylib 2>/dev/null)"

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Khronos official Vulkan ICD desktop loader for Windows, Linux, and MacOS.
  homepage: https://github.com/KhronosGroup/Vulkan-Loader

extra:
  feedstock-name: vulkan-loader
  recipe-maintainers:
    - JarrettSJohnson
    - traversaro
